name: Unit Tests
on:
  pull_request:
    branches:
      - main

concurrency:
  group: raberu-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ##################################################################################################
  ## Fast gate: pre-commit checks, standalone generation and sanitizers all start together with no
  ## interdependency - only once all three pass does the (much heavier) compiler matrix start below.
  ##################################################################################################
  precommit:
    name: Meta Checks
    uses: jfalcou/copacabana/.github/workflows/precommit.yml@05d0796125e284daa16d9a4f6424c58f98a2bb5a # v7

  ##################################################################################################
  ## Ensure Standalone is viable
  ##################################################################################################
  standalone-generation:
    name: Standalone Generation
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jfalcou/compilers:v10
    steps:
      - name: Fetch current branch
        uses: actions/checkout@v7

      - name: Generate standalone header
        run: |
          cmake -S . -B build -G Ninja -DRABERU_BUILD_TEST=OFF -DRABERU_BUILD_DOCUMENTATION=OFF
          cmake --build build --target raberu-standalone

      - name: Test standalone header
        run: |
          cd build
          g++ -std=c++20 -S -I. ../test/integration/main.cpp -DRABERU_STANDALONE

  ##################################################################################################
  ## Sanitizers (ASan+UBSan)
  ##################################################################################################
  sanitizer-tests:
    name: Sanitizers
    uses: jfalcou/copacabana/.github/workflows/sanitizers.yml@05d0796125e284daa16d9a4f6424c58f98a2bb5a # v7

  ##################################################################################################
  ## Coverage report - informational, runs alongside the gate without blocking the matrix
  ##################################################################################################
  coverage-report:
    name: Coverage
    uses: jfalcou/copacabana/.github/workflows/coverage.yml@05d0796125e284daa16d9a4f6424c58f98a2bb5a # v7
    with:
      project: raberu

  ##################################################################################################
  ## Unit Tests - the full compiler matrix, gated behind the fast checks above all passing
  ##################################################################################################
  linux-tests:
    name: Linux
    needs: [precommit, standalone-generation, sanitizer-tests]
    uses: jfalcou/copacabana/.github/workflows/matrix.yml@05d0796125e284daa16d9a4f6424c58f98a2bb5a # v7
    with:
      file: .github/matrices/linux.yml

  macos-tests:
    name: MacOS
    needs: [precommit, standalone-generation, sanitizer-tests]
    uses: jfalcou/copacabana/.github/workflows/matrix.yml@05d0796125e284daa16d9a4f6424c58f98a2bb5a # v7
    with:
      file: .github/matrices/macos.yml

  windows-tests:
    name: Windows
    needs: [precommit, standalone-generation, sanitizer-tests]
    uses: jfalcou/copacabana/.github/workflows/matrix.yml@05d0796125e284daa16d9a4f6424c58f98a2bb5a # v7
    with:
      file: .github/matrices/windows.yml
